<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New website quote request</title>
  </head>
  <body style="margin:0;background:#ece9e3;font-family:Arial,Helvetica,sans-serif;color:#172025">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#ece9e3">
      <tr>
        <td align="center" style="padding:28px 12px">
          <table role="presentation" cellspacing="0" cellpadding="0" style="width:100%;max-width:620px;background:#ffffff">
            <tr><td style="height:6px;background:#ae181e"></td></tr>
            <tr>
              <td style="padding:28px 34px;border-bottom:1px solid #dddddd">
                <img src="https://www.carsforcashreddeer.ca/assets/carsfircashreddeer-logo.png" width="220" alt="Cars for Cash Red Deer" style="display:block;max-width:100%;height:auto">
              </td>
            </tr>
            <tr>
              <td style="padding:35px 34px 22px">
                <p style="margin:0 0 10px;color:#ae181e;font-size:11px;font-weight:bold;letter-spacing:1.3px;text-transform:uppercase">New website quote request</p>
                <h1 style="margin:0;font-size:29px;line-height:1.2">{{vehicle}}</h1>
                <p style="margin:10px 0 0;color:#657075;font-size:13px">Received {{submitted_at}}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 34px 30px">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-top:1px solid #dddddd">
                  <tr><td style="padding:15px 0;border-bottom:1px solid #dddddd"><p style="margin:0 0 5px;color:#727b7f;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px">Name</p><p style="margin:0;font-size:15px;font-weight:bold">{{name}}</p></td></tr>
                  <tr><td style="padding:15px 0;border-bottom:1px solid #dddddd"><p style="margin:0 0 5px;color:#727b7f;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px">Phone</p><p style="margin:0;font-size:15px;font-weight:bold"><a href="tel:{{phone}}" style="color:#ae181e">{{phone}}</a></p></td></tr>
                  <tr><td style="padding:15px 0;border-bottom:1px solid #dddddd"><p style="margin:0 0 5px;color:#727b7f;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px">Email</p><p style="margin:0;font-size:15px;font-weight:bold">{{email}}</p></td></tr>
                  <tr><td style="padding:15px 0;border-bottom:1px solid #dddddd"><p style="margin:0 0 5px;color:#727b7f;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px">City</p><p style="margin:0;font-size:15px;font-weight:bold">{{city}}</p></td></tr>
                  <tr><td style="padding:15px 0;border-bottom:1px solid #dddddd"><p style="margin:0 0 5px;color:#727b7f;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px">Vehicle details</p><p style="margin:0;font-size:15px;font-weight:bold">{{vehicle}}</p></td></tr>
                  <tr><td style="padding:15px 0"><p style="margin:0 0 5px;color:#727b7f;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px">Message</p><p style="margin:0;white-space:pre-wrap;font-size:15px;line-height:1.65">{{message}}</p></td></tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 34px;background:#f4f1eb">
                <p style="margin:0 0 15px;color:#ae181e;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:1px">Tracking details</p>
                <p style="margin:7px 0;font-size:12px;line-height:1.55;color:#596469"><strong>IP address:</strong> {{ip_address}}</p>
                <p style="margin:7px 0;font-size:12px;line-height:1.55;color:#596469;overflow-wrap:anywhere"><strong>User agent:</strong> {{user_agent}}</p>
                <p style="margin:7px 0;font-size:12px;line-height:1.55;color:#596469;overflow-wrap:anywhere"><strong>Page URL:</strong> {{page_url}}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
